<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة HR الإدارية الذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-gray-800" x-data="hrApp()" x-init="init()">

    <!-- شاشة تسجيل الدخول -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-emerald-950 p-4">
            <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
                <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fas fa-users-cog"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800 mb-1">مخطط HR الذكي</h1>
                <p class="text-sm text-gray-500 mb-6">تسجيل الدخول للمنظومة</p>
                <div class="space-y-4 text-right">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">اسم المستخدم</label>
                        <input type="text" x-model="loginUser" class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500" placeholder="أدخل اسم المستخدم">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                        <input type="password" x-model="loginPass" @keyup.enter="handleLogin()" class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500" placeholder="أدخل كلمة المرور">
                    </div>
                    <button @click="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold transition">تسجيل الدخول</button>
                    <p x-show="loginError" class="text-red-500 text-sm text-center font-medium mt-2">خطأ في اسم المستخدم أو كلمة المرور!</p>
                </div>
            </div>
        </div>
    </template>

    <!-- التطبيق الرئيسي -->
    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col">
            <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center font-bold">HR</div>
                    <div>
                        <h1 class="text-base font-bold text-gray-800">نظام HR الإداري</h1>
                        <span class="text-xs text-emerald-600 font-bold">🟢 متصل بقاعدة البيانات</span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="loadData()" class="bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-xl text-xs font-bold"><i class="fas fa-sync-alt"></i> تحديث</button>
                    <span class="text-sm font-bold text-gray-700" x-text="currentUserObj.username"></span>
                    <button @click="logout()" class="text-red-600 p-2 rounded-xl" title="خروج"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </header>

            <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
                <!-- إضافة مهمة -->
                <div class="bg-white rounded-2xl shadow-sm border p-6">
                    <h2 class="text-base font-bold text-gray-800 mb-4">إضافة مهمة جديدة</h2>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input type="text" x-model="newTask.title" placeholder="عنوان المهمة..." class="px-4 py-2.5 border rounded-xl outline-none">
                        <select x-model="newTask.assignee" class="px-4 py-2.5 border rounded-xl bg-white outline-none">
                            <option value="">اختر المسؤول...</option>
                            <template x-for="u in usersList" :key="u.username">
                                <option :value="u.username" x-text="u.username + ' (' + u.position + ')'"></option>
                            </template>
                        </select>
                        <input type="date" x-model="newTask.date" class="px-4 py-2.5 border rounded-xl outline-none">
                        <button @click="addTask()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition">حفظ المهمة</button>
                    </div>
                </div>

                <!-- جدول المهام -->
                <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                <th class="p-4">#</th>
                                <th class="p-4">عنوان المهمة</th>
                                <th class="p-4">المسؤول</th>
                                <th class="p-4">تاريخ النهاية</th>
                                <th class="p-4">الحالة</th>
                                <th class="p-4 text-center">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y text-sm">
                            <template x-for="(task, index) in tasks" :key="task.id || index">
                                <tr class="hover:bg-gray-50">
                                    <td class="p-4 font-bold text-indigo-600" x-text="index + 1"></td>
                                    <td class="p-4 font-bold" x-text="task.title"></td>
                                    <td class="p-4 text-gray-700" x-text="task.assignee"></td>
                                    <td class="p-4 font-mono text-xs text-blue-600 font-bold" x-text="task.date"></td>
                                    <td class="p-4">
                                        <span class="px-2.5 py-1 rounded-full text-xs font-bold" 
                                              :class="task.status === 'completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'"
                                              x-text="task.status === 'completed' ? 'مكتملة ✅' : 'جارية ⏳'"></span>
                                    </td>
                                    <td class="p-4 text-center space-x-2 space-x-reverse">
                                        <button @click="markAsCompleted(task)" class="bg-emerald-50 text-emerald-600 px-3 py-1.5 rounded-lg text-xs font-bold">إتمام</button>
                                        <template x-if="currentUserObj.username === 'OMAR'">
                                            <button @click="deleteTask(task)" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold">حذف</button>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </template>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwuv73aHSXbyBF3NdswaDpJ_zS0FNgzRZzdrxyq3zD7yxJVDp1M4YthdN_U53Bsiiq2/exec";

        function hrApp() {
            return {
                isLoggedIn: false,
                loginUser: '',
                loginPass: '',
                loginError: false,
                currentUserObj: { username: '', role: 'user', position: 'موظف' },
                tasks: [],
                usersList: [],
                newTask: { title: '', assignee: '', date: '', status: 'pending', comments: '' },

                init() {
                    this.loadData();
                },

                async loadData() {
                    try {
                        let res = await fetch(SCRIPT_URL);
                        let data = await res.json();
                        if (data.users) this.usersList = data.users;
                        if (data.tasks) {
                            this.tasks = data.tasks.map(t => ({
                                id: String(t.id || ''),
                                title: String(t.title || ''),
                                assignee: String(t.assignee || ''),
                                date: String(t.date || '').split('T')[0],
                                status: String(t.status || 'pending').toLowerCase(),
                                comments: String(t.comments || '')
                            }));
                        }
                    } catch (e) {
                        console.error("Load error:", e);
                    }
                },

                handleLogin() {
                    let u = this.loginUser.trim();
                    let p = this.loginPass.trim();
                    let found = this.usersList.find(x => x.username.toLowerCase() === u.toLowerCase() && String(x.password).trim() === p);
                    if (found) {
                        this.isLoggedIn = true;
                        this.currentUserObj = found;
                        this.loginError = false;
                    } else {
                        this.loginError = true;
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.currentUserObj = { username: '', role: 'user', position: 'موظف' };
                },

                async addTask() {
                    if (!this.newTask.title.trim()) return;
                    let taskItem = {
                        id: String(Date.now()),
                        title: this.newTask.title.trim(),
                        assignee: this.newTask.assignee || this.currentUserObj.username,
                        date: this.newTask.date || new Date().toISOString().split('T')[0],
                        status: 'pending',
                        comments: ''
                    };
                    this.tasks.unshift(taskItem);
                    this.newTask = { title: '', assignee: '', date: '', status: 'pending', comments: '' };
                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST', mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'add_task', task: taskItem })
                        });
                    } catch (e) { console.error(e); }
                },

                async markAsCompleted(task) {
                    task.status = 'completed';
                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST', mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'update_status', id: String(task.id), status: 'completed' })
                        });
                    } catch (e) { console.error(e); }
                },

                async deleteTask(task) {
                    if (this.currentUserObj.username !== 'OMAR') return;
                    if (confirm('هل تريد حذف هذه المهمة نهائياً؟')) {
                        this.tasks = this.tasks.filter(t => String(t.id) !== String(task.id));
                        try {
                            await fetch(SCRIPT_URL, {
                                method: 'POST', mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'delete_task', id: String(task.id) })
                            });
                        } catch (e) { console.error(e); }
                    }
                }
            }
        }
    </script>
</body>
</html>
