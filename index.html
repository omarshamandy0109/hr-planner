<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة HR الإدارية الذكية</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-gray-800" x-data="hrApp()" x-init="init()">

    <!-- شاشة تسجيل الدخول -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-emerald-950 p-4">
            <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8 max-w-md w-full text-center border border-white/20">
                <div class="mb-6">
                    <div class="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner border border-emerald-100">
                        <i class="fas fa-users-cog"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">مخطط HR الذكي</h1>
                    <p class="text-sm text-gray-500 mt-1">تسجيل الدخول للمنظومة الإدارية المتكاملة</p>
                </div>
                <div class="space-y-4 text-right">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">اسم المستخدم</label>
                        <input type="text" x-model="loginUser" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition bg-gray-50" placeholder="أدخل اسم المستخدم">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                        <input type="password" x-model="loginPass" @keyup.enter="handleLogin()" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition bg-gray-50" placeholder="أدخل كلمة المرور">
                    </div>
                    <button @click="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold transition shadow-lg shadow-emerald-600/25">تسجيل الدخول</button>
                    <p x-show="loginError" class="text-red-500 text-sm text-center font-medium mt-2">اسم المستخدم أو كلمة المرور غير صحيحة!</p>
                </div>
            </div>
        </div>
    </template>

    <!-- التطبيق الرئيسي -->
    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col">
            <!-- الهيدر -->
            <header class="bg-white shadow-sm border-b px-6 py-4 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-50">
                <div class="flex items-center space-x-4 space-x-reverse">
                    <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-lg border border-emerald-100">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-gray-800">نظام HR الإداري</h1>
                        <span :class="isOnline ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'" class="text-xs px-2.5 py-0.5 rounded-full font-medium inline-block mt-0.5">
                            <span x-text="isOnline ? '🟢 متصل بقاعدة البيانات' : '🟡 جاري المزامنة...'"></span>
                        </span>
                    </div>
                </div>

                <div class="flex items-center flex-wrap gap-2">
                    <button @click="activeTab = 'tasks'" :class="activeTab === 'tasks' ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'" class="px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
                        <i class="fas fa-tasks"></i> لوحة المهام
                    </button>
                    
                    <template x-if="currentUserObj.role === 'admin'">
                        <button @click="activeTab = 'kpis'" :class="activeTab === 'kpis' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'" class="px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
                            <i class="fas fa-chart-line"></i> تحليلات KPIs
                        </button>
                    </template>

                    <template x-if="currentUserObj.role === 'admin'">
                        <button @click="activeTab = 'users'" :class="activeTab === 'users' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'" class="px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2">
                            <i class="fas fa-users-gear"></i> إدارة المستخدمين (<span x-text="usersList.length"></span>)
                        </button>
                    </template>

                    <button @click="syncData(true)" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5">
                        <i class="fas fa-sync-alt" :class="{'fa-spin': isSyncing}"></i> تحديث
                    </button>

                    <button @click="openChangePasswordModal()" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1.5">
                        <i class="fas fa-key"></i> كلمة المرور
                    </button>

                    <div class="h-6 w-px bg-gray-200"></div>

                    <div class="text-right px-2">
                        <span class="text-xs text-gray-400 block" x-text="currentUserObj.position"></span>
                        <span class="text-sm font-bold text-gray-800" x-text="currentUserObj.username"></span>
                    </div>

                    <button @click="logout()" class="text-red-600 hover:bg-red-50 p-2 rounded-xl text-sm font-medium transition" title="خروج">
                        <i class="fas fa-sign-out-alt text-lg"></i>
                    </button>
                </div>
            </header>

            <!-- المحتوى -->
            <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">

                <!-- 1️⃣ قسم المهام -->
                <div x-show="activeTab === 'tasks'" class="space-y-6">
                    <!-- الإحصائيات دقيقة ومترابطة تفاعلياً -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 font-medium">إجمالي المهام المعروضة</p>
                                <h3 class="text-3xl font-bold text-gray-800 mt-1" x-text="getFilteredTasks().length">0</h3>
                            </div>
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl"><i class="fas fa-clipboard-list"></i></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 font-medium">المنجزة بالكامل</p>
                                <h3 class="text-3xl font-bold text-emerald-600 mt-1" x-text="getCompletedTasks().length">0</h3>
                            </div>
                            <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-xl"><i class="fas fa-check-circle"></i></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 font-medium">قيد التنفيذ والجارية</p>
                                <h3 class="text-3xl font-bold text-amber-600 mt-1" x-text="getPendingTasks().length">0</h3>
                            </div>
                            <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-xl"><i class="fas fa-clock"></i></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                            <div>
                                <p class="text-sm text-gray-500 font-medium">نسبة الإنجاز العامة</p>
                                <h3 class="text-3xl font-bold text-indigo-600 mt-1" x-text="getCompletionRate() + '%'">0%</h3>
                            </div>
                            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-xl"><i class="fas fa-chart-pie"></i></div>
                        </div>
                    </div>

                    <!-- نموذج إضافة مهمة -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                        <h2 class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <i class="fas fa-plus-circle text-emerald-600"></i> 
                            <span x-text="canAssignTasks() ? 'إضافة وإسناد مهمة جديدة' : 'إضافة مهمة جديدة لنفسي'"></span>
                        </h2>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <input type="text" x-model="newTask.title" placeholder="عنوان المهمة..." class="px-4 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                            
                            <template x-if="canAssignTasks()">
                                <select x-model="newTask.assignee" class="px-4 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                                    <option value="">اختر المسؤول (افتراضي: لنفسك)...</option>
                                    <template x-for="user in getAllowedAssignees()" :key="user.username">
                                        <option :value="user.username" x-text="user.username + ' (' + user.position + ')'"></option>
                                    </template>
                                </select>
                            </template>
                            <template x-if="!canAssignTasks()">
                                <div class="px-4 py-2.5 border rounded-xl bg-gray-50 text-gray-700 text-sm flex items-center font-medium">
                                    <span>المسؤول: <strong class="text-emerald-700" x-text="currentUserObj.username + ' (' + currentUserObj.position + ')'"></strong></span>
                                </div>
                            </template>

                            <input type="date" x-model="newTask.date" class="px-4 py-2.5 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                            <button @click="addTask()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl transition shadow-md shadow-emerald-600/25 flex items-center justify-center gap-2">
                                <i class="fas fa-save"></i> حفظ المهمة
                            </button>
                        </div>
                    </div>

                    <!-- شريط التحكم في العرض -->
                    <div class="flex flex-wrap justify-between items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <div class="flex items-center gap-2 bg-gray-100 p-1 rounded-xl">
                            <button @click="taskViewMode = 'all'" :class="taskViewMode === 'all' ? 'bg-white text-emerald-700 shadow-xs' : 'text-gray-600'" class="px-4 py-1.5 rounded-lg text-xs font-bold transition">كل مهام الفريق</button>
                            <button @click="taskViewMode = 'mine'" :class="taskViewMode === 'mine' ? 'bg-white text-emerald-700 shadow-xs' : 'text-gray-600'" class="px-4 py-1.5 rounded-lg text-xs font-bold transition">مهامي الخاصة</button>
                        </div>

                        <div class="flex items-center gap-2 bg-gray-100 p-1 rounded-xl">
                            <button @click="displayMode = 'grid'" :class="displayMode === 'grid' ? 'bg-white text-indigo-700 shadow-xs' : 'text-gray-600'" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                                <i class="fas fa-th-large"></i> عرض كروت
                            </button>
                            <button @click="displayMode = 'list'" :class="displayMode === 'list' ? 'bg-white text-indigo-700 shadow-xs' : 'text-gray-600'" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                                <i class="fas fa-list"></i> عرض جدول (List)
                            </button>
                        </div>
                    </div>

                    <!-- 1️⃣ قسم المهام الجارية -->
                    <div class="space-y-4">
                        <h3 class="text-sm font-bold text-amber-700 flex items-center gap-2">
                            <i class="fas fa-hourglass-half"></i> المهام الجارية وقيد التنفيذ ( <span x-text="getPendingTasks().length"></span> )
                        </h3>

                        <!-- عرض بطاقات (Grid) -->
                        <template x-if="displayMode === 'grid'">
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                <template x-for="(task, index) in getPendingTasks()" :key="task.id || index">
                                    <div class="bg-white border rounded-2xl p-5 shadow-sm space-y-4 relative flex flex-col justify-between"
                                         :class="{
                                             'border-red-400 bg-red-50/25 shadow-md': getTaskUrgency(task.date).level === 'overdue' || getTaskUrgency(task.date).level === 'today',
                                             'border-amber-300 bg-amber-50/20': getTaskUrgency(task.date).level === 'soon',
                                             'border-gray-200': getTaskUrgency(task.date).level === 'normal'
                                         }">
                                         
                                        <div class="absolute top-4 left-4 flex gap-1 items-center">
                                            <span class="text-xs px-2.5 py-1 rounded-full font-bold shadow-2xs flex items-center gap-1"
                                                  :class="{
                                                      'bg-red-100 text-red-700 animate-pulse': getTaskUrgency(task.date).level === 'overdue' || getTaskUrgency(task.date).level === 'today',
                                                      'bg-amber-100 text-amber-800': getTaskUrgency(task.date).level === 'soon',
                                                      'bg-slate-100 text-slate-700': getTaskUrgency(task.date).level === 'normal'
                                                  }">
                                                <i class="fas" :class="{
                                                    'fa-exclamation-triangle': getTaskUrgency(task.date).level === 'overdue' || getTaskUrgency(task.date).level === 'today',
                                                    'fa-clock': getTaskUrgency(task.date).level === 'soon',
                                                    'fa-calendar-check': getTaskUrgency(task.date).level === 'normal'
                                                }"></i>
                                                <span x-text="getTaskUrgency(task.date).text"></span>
                                            </span>
                                        </div>

                                        <div class="space-y-2 pr-2 pt-2">
                                            <h4 class="font-bold text-lg leading-snug"
                                                :class="{
                                                    'text-red-600 font-black': getTaskUrgency(task.date).level === 'overdue' || getTaskUrgency(task.date).level === 'today',
                                                    'text-gray-800': getTaskUrgency(task.date).level !== 'overdue' && getTaskUrgency(task.date).level !== 'today'
                                                }"
                                                x-text="task.title"></h4>

                                            <div class="flex items-center gap-2 text-xs text-gray-500">
                                                <i class="fas fa-user-tie text-indigo-600"></i>
                                                <span>المسؤول: <strong class="text-gray-700" x-text="task.assignee"></strong></span>
                                            </div>
                                            <div class="flex items-center gap-2 text-xs text-gray-500">
                                                <i class="fas fa-calendar-alt text-blue-600"></i>
                                                <span>التاريخ: <strong class="text-gray-700" x-text="task.date"></strong></span>
                                            </div>
                                        </div>

                                        <div class="bg-slate-50 border border-gray-200 rounded-xl p-3 space-y-2">
                                            <span class="text-xs font-bold text-gray-600 block"><i class="fas fa-comments text-indigo-600 ml-1"></i> الردود والتعليقات:</span>
                                            <div class="max-h-28 overflow-y-auto space-y-1 text-xs text-gray-700 font-medium">
                                                <template x-if="task.comments">
                                                    <div class="whitespace-pre-line bg-white p-2 rounded-lg border border-gray-100 shadow-2xs" x-text="task.comments"></div>
                                                </template>
                                                <template x-if="!task.comments">
                                                    <span class="text-gray-400 italic block">لا توجد تعليقات بعد...</span>
                                                </template>
                                            </div>

                                            <div class="flex gap-2 pt-1">
                                                <input type="text" x-model="task.newCommentText" @keyup.enter="addComment(task)" placeholder="اكتب رداً أو تعليقاً..." class="flex-1 px-3 py-1.5 text-xs border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                                                <button @click="addComment(task)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 text-xs font-bold rounded-lg transition">إرسال</button>
                                            </div>
                                        </div>

                                        <div class="pt-3 border-t border-gray-100 flex flex-wrap justify-between items-center gap-2">
                                            <template x-if="canAssignTasks() || task.assignee.toLowerCase().trim() === currentUserObj.username.toLowerCase().trim()">
                                                <button @click="markAsCompleted(task)" class="flex-1 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1">
                                                    <i class="fas fa-check"></i> إتمام المهمة
                                                </button>
                                            </template>

                                            <template x-if="canAssignTasks()">
                                                <button @click="editTask(task)" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-2 rounded-xl text-xs font-bold transition" title="تعديل المهمة">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                            </template>

                                            <template x-if="currentUserObj.username === 'OMAR'">
                                                <button @click="deleteTask(task)" class="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-2 rounded-xl text-xs font-bold transition" title="حذف المهمة">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- عرض جدول (List) -->
                        <template x-if="displayMode === 'list'">
                            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                <table class="w-full text-right border-collapse">
                                    <thead>
                                        <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                            <th class="p-4">عنوان المهمة</th>
                                            <th class="p-4">المسؤول عنها</th>
                                            <th class="p-4">التاريخ</th>
                                            <th class="p-4">الحالة والتنبيه</th>
                                            <th class="p-4 text-center">الإجراءات</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100 text-sm">
                                        <template x-for="(task, index) in getPendingTasks()" :key="task.id || index">
                                            <tr class="hover:bg-gray-50/50 transition">
                                                <td class="p-4 font-bold"
                                                    :class="{
                                                        'text-red-600': getTaskUrgency(task.date).level === 'overdue' || getTaskUrgency(task.date).level === 'today',
                                                        'text-gray-800': getTaskUrgency(task.date).level !== 'overdue' && getTaskUrgency(task.date).level !== 'today'
                                                    }"
                                                    x-text="task.title"></td>
                                                <td class="p-4 text-gray-700" x-text="task.assignee"></td>
                                                <td class="p-4 text-gray-600 font-mono text-xs" x-text="task.date"></td>
                                                <td class="p-4">
                                                    <span class="text-xs px-2.5 py-1 rounded-full font-bold inline-block"
                                                          :class="{
                                                              'bg-red-100 text-red-700': getTaskUrgency(task.date).level === 'overdue' || getTaskUrgency(task.date).level === 'today',
                                                              'bg-amber-100 text-amber-800': getTaskUrgency(task.date).level === 'soon',
                                                              'bg-slate-100 text-slate-700': getTaskUrgency(task.date).level === 'normal'
                                                          }"
                                                          x-text="getTaskUrgency(task.date).text"></span>
                                                </td>
                                                <td class="p-4 text-center space-x-2 space-x-reverse">
                                                    <template x-if="canAssignTasks() || task.assignee.toLowerCase().trim() === currentUserObj.username.toLowerCase().trim()">
                                                        <button @click="markAsCompleted(task)" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-3 py-1.5 rounded-lg text-xs font-bold transition">إتمام</button>
                                                    </template>
                                                    <template x-if="canAssignTasks()">
                                                        <button @click="editTask(task)" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-xs font-bold transition">تعديل</button>
                                                    </template>
                                                    <template x-if="currentUserObj.username === 'OMAR'">
                                                        <button @click="deleteTask(task)" class="bg-red-50 text-red-600 hover:bg-red-100 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">حذف</button>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template x-if="getPendingTasks().length === 0">
                            <div class="bg-white p-8 rounded-2xl text-center text-gray-400 font-medium shadow-sm border">لا توجد مهام جارية حالياً.</div>
                        </template>
                    </div>

                    <!-- 2️⃣ قسم المهام المكتملة -->
                    <div class="space-y-4 pt-4 border-t border-gray-200">
                        <h3 class="text-sm font-bold text-emerald-700 flex items-center gap-2">
                            <i class="fas fa-check-circle"></i> سجل المهام المكتملة والمؤرشفة ( <span x-text="getCompletedTasks().length"></span> )
                        </h3>

                        <!-- عرض بطاقات الأرشيف -->
                        <template x-if="displayMode === 'grid'">
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                <template x-for="(task, index) in getCompletedTasks()" :key="task.id || index">
                                    <div class="bg-emerald-50/40 border border-emerald-200 rounded-2xl p-5 shadow-sm space-y-4 relative flex flex-col justify-between">
                                        <div class="absolute top-4 left-4">
                                            <span class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-bold">تم التنفيذ ✅</span>
                                        </div>

                                        <div class="space-y-2 pr-2">
                                            <h4 class="font-bold text-gray-600 text-lg leading-snug line-through" x-text="task.title"></h4>
                                            <div class="flex items-center gap-2 text-xs text-gray-500">
                                                <i class="fas fa-user-tie text-indigo-600"></i>
                                                <span>المسؤول: <strong class="text-gray-700" x-text="task.assignee"></strong></span>
                                            </div>
                                            <div class="flex items-center gap-2 text-xs text-gray-500">
                                                <i class="fas fa-calendar-alt text-blue-600"></i>
                                                <span>التاريخ: <strong class="text-gray-700" x-text="task.date"></strong></span>
                                            </div>
                                        </div>

                                        <div class="bg-white border border-emerald-100 rounded-xl p-3 space-y-2">
                                            <span class="text-xs font-bold text-gray-600 block"><i class="fas fa-comments text-indigo-600 ml-1"></i> التعليقات والملاحظات:</span>
                                            <div class="max-h-24 overflow-y-auto space-y-1 text-xs text-gray-700 font-medium">
                                                <template x-if="task.comments">
                                                    <div class="whitespace-pre-line bg-gray-50 p-2 rounded-lg border border-gray-100" x-text="task.comments"></div>
                                                </template>
                                                <template x-if="!task.comments">
                                                    <span class="text-gray-400 italic block">لا توجد تعليقات...</span>
                                                </template>
                                            </div>
                                            <div class="flex gap-2 pt-1">
                                                <input type="text" x-model="task.newCommentText" @keyup.enter="addComment(task)" placeholder="اكتب تعليقاً إضافياً..." class="flex-1 px-3 py-1.5 text-xs border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                                                <button @click="addComment(task)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 text-xs font-bold rounded-lg transition">إرسال</button>
                                            </div>
                                        </div>

                                        <div class="pt-3 border-t border-emerald-100 flex justify-between items-center gap-2">
                                            <span class="w-full text-center text-xs font-bold text-emerald-700 bg-emerald-100/60 py-2 rounded-xl">مكتملة ومؤرشفة نهائياً</span>
                                            
                                            <template x-if="currentUserObj.username === 'OMAR'">
                                                <button @click="deleteTask(task)" class="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-2 rounded-xl text-xs font-bold transition" title="حذف المهمة">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- عرض جدول للأرشيف -->
                        <template x-if="displayMode === 'list'">
                            <div class="bg-white rounded-2xl shadow-sm border border-emerald-100 overflow-hidden">
                                <table class="w-full text-right border-collapse">
                                    <thead>
                                        <tr class="bg-emerald-50 text-emerald-800 text-sm border-b">
                                            <th class="p-4">عنوان المهمة المكتملة</th>
                                            <th class="p-4">المسؤول</th>
                                            <th class="p-4">التاريخ</th>
                                            <th class="p-4">الحالة</th>
                                            <th class="p-4 text-center">الإجراءات</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100 text-sm">
                                        <template x-for="(task, index) in getCompletedTasks()" :key="task.id || index">
                                            <tr class="hover:bg-gray-50/50 transition">
                                                <td class="p-4 font-bold text-gray-600 line-through" x-text="task.title"></td>
                                                <td class="p-4 text-gray-700" x-text="task.assignee"></td>
                                                <td class="p-4 text-gray-600 font-mono text-xs" x-text="task.date"></td>
                                                <td class="p-4">
                                                    <span class="text-xs px-2.5 py-1 rounded-full font-bold bg-emerald-100 text-emerald-800">مكتملة ✅</span>
                                                </td>
                                                <td class="p-4 text-center">
                                                    <template x-if="currentUserObj.username === 'OMAR'">
                                                        <button @click="deleteTask(task)" class="bg-red-50 text-red-600 hover:bg-red-100 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">حذف</button>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template x-if="getCompletedTasks().length === 0">
                            <div class="bg-white p-8 rounded-2xl text-center text-gray-400 font-medium shadow-sm border">لا توجد مهام مكتملة حتى الآن.</div>
                        </template>
                    </div>

                </div>

                <!-- 2️⃣ تبويب KPIs -->
                <div x-show="activeTab === 'kpis' && currentUserObj.role === 'admin'" class="space-y-6">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <h2 class="text-lg font-bold text-gray-800">تحليلات مؤشرات الأداء (KPIs) المتقدمة</h2>
                                <p class="text-xs text-gray-500">تقييم وتحليل دقيق لإنتاجية وإنجازات كل موظف في المنظومة لحظياً</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <template x-for="kpi in getDetailedKpis()" :key="kpi.username">
                                <div class="bg-slate-50 border border-gray-200 rounded-2xl p-5 shadow-sm space-y-4 relative overflow-hidden">
                                    <div class="absolute top-0 right-0 w-2 h-full" :class="kpi.rate >= 80 ? 'bg-emerald-500' : (kpi.rate >= 50 ? 'bg-amber-500' : 'bg-red-500')"></div>
                                    
                                    <div class="flex justify-between items-center">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 bg-indigo-100 text-indigo-700 rounded-xl flex items-center justify-center font-bold">
                                                <i class="fas fa-user-tie"></i>
                                            </div>
                                            <div>
                                                <h4 class="font-bold text-gray-800 text-base" x-text="kpi.username"></h4>
                                                <span class="text-xs px-2 py-0.5 rounded-full font-bold bg-blue-100 text-blue-700" x-text="kpi.position"></span>
                                            </div>
                                        </div>
                                        <div class="text-left">
                                            <span class="text-2xl font-black" :class="kpi.rate >= 80 ? 'text-emerald-600' : (kpi.rate >= 50 ? 'text-amber-600' : 'text-red-600')" x-text="kpi.rate + '%'"></span>
                                        </div>
                                    </div>

                                    <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
                                        <div class="h-full transition-all duration-500" :class="kpi.rate >= 80 ? 'bg-emerald-500' : (kpi.rate >= 50 ? 'bg-amber-500' : 'bg-red-500')" :style="`width: ${kpi.rate}%`"></div>
                                    </div>

                                    <div class="grid grid-cols-3 gap-2 text-center pt-2 border-t border-gray-200 text-xs">
                                        <div class="bg-white p-2 rounded-xl shadow-xs">
                                            <span class="text-gray-400 block font-medium">المهام</span>
                                            <strong class="text-gray-800 text-sm" x-text="kpi.total"></strong>
                                        </div>
                                        <div class="bg-white p-2 rounded-xl shadow-xs">
                                            <span class="text-emerald-500 block font-medium">المنجزة</span>
                                            <strong class="text-emerald-600 text-sm" x-text="kpi.completed"></strong>
                                        </div>
                                        <div class="bg-white p-2 rounded-xl shadow-xs">
                                            <span class="text-amber-500 block font-medium">قيد التنفيذ</span>
                                            <strong class="text-amber-600 text-sm" x-text="kpi.pending"></strong>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- 3️⃣ تبويب إدارة المستخدمين -->
                <div x-show="activeTab === 'users' && currentUserObj.role === 'admin'" class="space-y-6">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex justify-between items-center">
                        <div>
                            <h2 class="text-lg font-bold text-gray-800">إدارة المستخدمين والصلاحيات والبوزشنات الوظيفية</h2>
                            <p class="text-xs text-gray-500">حساب OMAR محمي كلياً ولا يمكن تعديله أو حذفه إلا من خلاله شخصياً</p>
                        </div>
                        <button @click="openAddUserModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl transition shadow-md shadow-indigo-600/25 flex items-center gap-2">
                            <i class="fas fa-user-plus"></i> إضافة مستخدم جديد
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <table class="w-full text-right border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                    <th class="p-4">اسم المستخدم</th>
                                    <th class="p-4">كلمة المرور</th>
                                    <th class="p-4">المسمى الوظيفي (Position)</th>
                                    <th class="p-4">الصلاحية (Role)</th>
                                    <th class="p-4 text-center">الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-for="(user, uIdx) in usersList" :key="user.username">
                                    <tr class="hover:bg-gray-50/50 transition">
                                        <td class="p-4 font-bold text-gray-800" x-text="user.username"></td>
                                        <td class="p-4 text-gray-500 font-mono text-sm" x-text="user.username === 'OMAR' && currentUserObj.username !== 'OMAR' ? '••••••' : user.password"></td>
                                        <td class="p-4">
                                            <input type="text" x-model="user.position" @change="saveUsersToDatabase()" class="px-3 py-1.5 border rounded-lg text-xs font-bold bg-gray-50 outline-none focus:ring-2 focus:ring-indigo-500" :disabled="user.username === 'OMAR' && currentUserObj.username !== 'OMAR'">
                                        </td>
                                        <td class="p-4">
                                            <select x-model="user.role" @change="saveUsersToDatabase()" class="px-3 py-1.5 border rounded-lg text-xs font-bold bg-gray-50 outline-none focus:ring-2 focus:ring-indigo-500" :disabled="user.username === 'OMAR'">
                                                <option value="admin">مدير / Admin</option>
                                                <option value="supervisor">مشرف / Supervisor</option>
                                                <option value="user">موظف / User</option>
                                            </select>
                                        </td>
                                        <td class="p-4 text-center space-x-2 space-x-reverse">
                                            <template x-if="user.username !== 'OMAR' || currentUserObj.username === 'OMAR'">
                                                <button @click="editUserPassword(user)" class="bg-amber-50 text-amber-600 hover:bg-amber-100 px-3 py-1.5 rounded-lg text-xs font-bold transition">تعديل الباسورد</button>
                                            </template>
                                            
                                            <template x-if="user.username !== 'OMAR' && user.username !== currentUserObj.username">
                                                <button @click="deleteUser(user)" class="bg-red-50 text-red-600 hover:bg-red-100 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">حذف</button>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </template>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwuv73aHSXbyBF3NdswaDpJ_zS0FNgzRZzdrxyq3zD7yxJVDp1M4YthdN_U53Bsiiq2/exec";

        function hrApp() {
            return {
                isLoggedIn: false,
                loginUser: '',
                loginPass: '',
                loginError: false,
                currentUserObj: { username: '', role: 'user', position: 'موظف' },
                activeTab: 'tasks',
                taskViewMode: 'mine', 
                displayMode: 'list',   
                isOnline: false,
                isSyncing: false,
                tasks: [],
                deletedIds: JSON.parse(localStorage.getItem('deleted_tasks_ids') || '[]'),
                usersList: [],
                newTask: { title: '', assignee: '', date: '', status: 'pending', comments: '' },

                init() {
                    this.loadData();
                },

                async loadData() {
                    try {
                        const res = await fetch(SCRIPT_URL);
                        const data = await res.json();
                        
                        if (data.users) this.usersList = data.users;
                        if (data.tasks) {
                            this.tasks = data.tasks
                                .filter(t => !this.deletedIds.includes(String(t.id)))
                                .map(t => ({ ...t, id: String(t.id), newCommentText: '' }));
                        }
                        
                        this.isOnline = true;
                    } catch (e) {
                        console.error("Load error:", e);
                        this.isOnline = false;
                    }
                },

                // محرك الفلترة الأساسي (العمود الفقري لحسابات الواجهة الأمامية)
                getFilteredTasks() {
                    let list = [...this.tasks];
                    let myName = (this.currentUserObj.username || '').toLowerCase().trim();
                    
                    if (this.taskViewMode === 'mine') {
                        list = list.filter(t => (t.assignee || '').toLowerCase().trim() === myName);
                    }

                    list.sort((a, b) => {
                        let dateA = a.date ? new Date(a.date) : new Date('9999-12-31');
                        let dateB = b.date ? new Date(b.date) : new Date('9999-12-31');
                        return dateA - dateB;
                    });

                    return list;
                },

                getPendingTasks() {
                    return this.getFilteredTasks().filter(t => t.status !== 'completed');
                },

                getCompletedTasks() {
                    return this.getFilteredTasks().filter(t => t.status === 'completed');
                },

                getCompletionRate() {
                    let list = this.getFilteredTasks();
                    if (list.length === 0) return 0;
                    let completed = list.filter(t => t.status === 'completed').length;
                    return Math.round((completed / list.length) * 100);
                },

                handleLogin() {
                    let u = this.loginUser.trim();
                    let p = this.loginPass.trim();

                    let found = this.usersList.find(x => x.username.toLowerCase() === u.toLowerCase() && String(x.password).trim() === p);

                    if (found) {
                        this.isLoggedIn = true;
                        this.currentUserObj = found;
                        this.loginError = false;
                        this.taskViewMode = 'mine';
                        Swal.fire({ icon: 'success', title: 'أهلاً بك ' + found.username, timer: 1200, showConfirmButton: false });
                    } else {
                        this.loginError = true;
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.loginUser = '';
                    this.loginPass = '';
                    this.currentUserObj = { username: '', role: 'user', position: 'موظف' };
                },

                canAssignTasks() {
                    let u = this.currentUserObj.username;
                    return u === 'OMAR' || u === 'Mohamed.Desouky' || u === 'Amr.Ragab' || u === 'Ahmed.Maher';
                },

                getAllowedAssignees() {
                    let u = this.currentUserObj.username;
                    let list = [];
                    if (u === 'Amr.Ragab') {
                        list = this.usersList.filter(user => user.role === 'user');
                    } else if (u === 'Ahmed.Maher') {
                        list = this.usersList.filter(user => user.username !== 'OMAR' && user.username !== 'Mohamed.Desouky');
                    } else {
                        list = this.usersList.filter(user => user.username !== 'OMAR');
                    }
                    if (!list.some(x => x.username === u)) {
                        list.unshift(this.currentUserObj);
                    }
                    return list;
                },

                getTaskUrgency(dateStr) {
                    if (!dateStr) return { level: 'normal', text: 'محدد' };
                    
                    let today = new Date();
                    today.setHours(0, 0, 0, 0);
                    
                    let tDate = new Date(dateStr);
                    tDate.setHours(0, 0, 0, 0);
                    
                    let diffTime = tDate - today;
                    let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (diffDays < 0) {
                        return { level: 'overdue', text: 'متأخرة ❌' };
                    } else if (diffDays === 0) {
                        return { level: 'today', text: 'ميعادها اليوم 🚨' };
                    } else if (diffDays <= 3) {
                        return { level: 'soon', text: `متبقي ${diffDays} أيام ⚠️` };
                    } else {
                        return { level: 'normal', text: `متبقي ${diffDays} يوم` };
                    }
                },

                getDetailedKpis() {
                    return this.usersList.filter(u => u.username !== 'OMAR').map(user => {
                        let userTasks = this.tasks.filter(t => (t.assignee || '').toLowerCase().trim() === (user.username || '').toLowerCase().trim());
                        let total = userTasks.length;
                        let completed = userTasks.filter(t => t.status === 'completed').length;
                        let pending = total - completed;
                        let rate = total > 0 ? Math.round((completed / total) * 100) : 0;
                        return {
                            username: user.username,
                            position: user.position,
                            total,
                            completed,
                            pending,
                            rate
                        };
                    });
                },

                async syncData(showNotice = false) {
                    this.isSyncing = true;
                    await this.loadData();
                    this.isSyncing = false;
                    if(showNotice) {
                        Swal.fire({ icon: 'success', title: 'تمت المزامنة بنجاح', timer: 1200, showConfirmButton: false });
                    }
                },

                async addTask() {
                    if (!this.newTask.title.trim()) {
                        Swal.fire('تنبيه', 'يرجى كتابة عنوان المهمة', 'warning');
                        return;
                    }

                    let assignedTo = '';
                    if (this.canAssignTasks()) {
                        assignedTo = this.newTask.assignee ? this.newTask.assignee : this.currentUserObj.username;
                    } else {
                        assignedTo = this.currentUserObj.username;
                    }

                    let taskItem = {
                        id: String(Date.now()),
                        title: this.newTask.title.trim(),
                        assignee: assignedTo,
                        date: this.newTask.date || new Date().toISOString().split('T')[0],
                        status: 'pending',
                        comments: '',
                        newCommentText: ''
                    };

                    this.tasks.push(taskItem);
                    this.newTask = { title: '', assignee: '', date: '', status: 'pending', comments: '' };
                    
                    Swal.fire({ icon: 'success', title: 'تمت إضافة المهمة بنجاح', timer: 1500, showConfirmButton: false });

                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'add_task', task: taskItem })
                        });
                    } catch (e) {
                        console.error(e);
                    }
                },

                async editTask(task) {
                    const { value: formValues } = await Swal.fire({
                        title: 'تعديل المهمة',
                        html:
                            `<input id="swal-title" class="swal2-input" placeholder="عنوان المهمة" value="${task.title}">` +
                            `<input id="swal-date" type="date" class="swal2-input" value="${task.date}">`,
                        focusConfirm: false,
                        showCancelButton: true,
                        confirmButtonText: 'حفظ التعديلات',
                        cancelButtonText: 'إلغاء',
                        preConfirm: () => {
                            return [
                                document.getElementById('swal-title').value.trim(),
                                document.getElementById('swal-date').value
                            ]
                        }
                    });

                    if (formValues) {
                        let [newTitle, newDate] = formValues;
                        if (!newTitle) {
                            Swal.fire('خطأ', 'عنوان المهمة لا يمكن أن يكون فارغاً', 'error');
                            return;
                        }

                        task.title = newTitle;
                        task.date = newDate || task.date;

                        Swal.fire({ icon: 'success', title: 'تم تعديل المهمة بنجاح', timer: 1200, showConfirmButton: false });

                        try {
                            await fetch(SCRIPT_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'add_task', task: { ...task, id: String(task.id) } })
                            });
                        } catch (e) {
                            console.error(e);
                        }
                    }
                },

                async addComment(task) {
                    if (!task.newCommentText || !task.newCommentText.trim()) return;
                    
                    let timestamp = new Date().toLocaleDateString('ar-EG') + ' ' + new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
                    let formattedComment = `[${this.currentUserObj.username} (${this.currentUserObj.position}) - ${timestamp}]: ${task.newCommentText.trim()}`;
                    
                    if (task.comments) {
                        task.comments += '\n' + formattedComment;
                    } else {
                        task.comments = formattedComment;
                    }
                    
                    task.newCommentText = '';

                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'update_comments', id: String(task.id), comments: task.comments })
                        });
                        Swal.fire({ icon: 'success', title: 'تم إرسال التعليق', timer: 1000, showConfirmButton: false });
                    } catch (e) {
                        console.error(e);
                    }
                },

                async markAsCompleted(task) {
                    if (task.status === 'completed') return;
                    task.status = 'completed';
                    Swal.fire({ icon: 'success', title: 'تم إتمام المهمة بنجاح', timer: 1000, showConfirmButton: false });
                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'update_status', id: String(task.id), status: 'completed' })
                        });
                    } catch (e) {
                        console.error(e);
                    }
                },

                async deleteTask(task) {
                    if (this.currentUserObj.username !== 'OMAR') {
                        Swal.fire('خطأ', 'عذراً، حذف المهام متاح فقط للأدمن الرئيسي OMAR!', 'error');
                        return;
                    }

                    if (confirm(`هل أنت متأكد من حذف المهمة: "${task.title}" نهائياً؟`)) {
                        let targetId = String(task.id);
                        
                        this.tasks = this.tasks.filter(t => String(t.id) !== targetId);
                        
                        if (!this.deletedIds.includes(targetId)) {
                            this.deletedIds.push(targetId);
                            localStorage.setItem('deleted_tasks_ids', JSON.stringify(this.deletedIds));
                        }
                        
                        Swal.fire('تم', 'تم حذف المهمة بنجاح', 'success');

                        try {
                            await fetch(SCRIPT_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'delete_task', id: targetId, task: { id: targetId, title: task.title } })
                            });
                        } catch (e) {
                            console.error(e);
                        }
                    }
                },

                async saveUsersToDatabase() {
                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'save_users', users: this.usersList })
                        });
                    } catch(e) {
                        console.error(e);
                    }
                },

                async openAddUserModal() {
                    const { value: formValues } = await Swal.fire({
                        title: 'إضافة مستخدم جديد',
                        html:
                            '<input id="swal-user" class="swal2-input" placeholder="اسم المستخدم">' +
                            '<input id="swal-pass" type="password" class="swal2-input" placeholder="كلمة المرور">' +
                            '<input id="swal-pos" class="swal2-input" placeholder="المسمى الوظيفي (Position)">' +
                            '<select id="swal-role" class="swal2-input"><option value="user">موظف</option><option value="supervisor">مشرف</option><option value="admin">مدير/أدمن</option></select>',
                        focusConfirm: false,
                        showCancelButton: true,
                        confirmButtonText: 'إضافة الحساب',
                        cancelButtonText: 'إلغاء',
                        preConfirm: () => {
                            return [
                                document.getElementById('swal-user').value.trim(),
                                document.getElementById('swal-pass').value.trim(),
                                document.getElementById('swal-pos').value.trim(),
                                document.getElementById('swal-role').value
                            ]
                        }
                    });

                    if (formValues) {
                        let [username, password, position, role] = formValues;
                        if (!username || !password) {
                            Swal.fire('خطأ', 'يرجى ملء كافة البيانات الأساسية', 'error');
                            return;
                        }

                        if (this.usersList.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                            Swal.fire('خطأ', 'اسم المستخدم هذا موجود بالفعل!', 'error');
                            return;
                        }

                        this.usersList.push({ username, password, role, position: position || 'موظف' });
                        await this.saveUsersToDatabase();
                        Swal.fire('تم بنجاح', `تم إضافة المستخدم (${username}) بنجاح!`, 'success');
                    }
                },

                async editUserPassword(user) {
                    if (user.username === 'OMAR' && this.currentUserObj.username !== 'OMAR') {
                        Swal.fire('خطأ', 'لا يمكن تعديل حساب OMAR إلا من خلاله شخصياً!', 'error');
                        return;
                    }

                    const { value: newPass } = await Swal.fire({
                        title: `تعديل كلمة مرور (${user.username})`,
                        input: 'password',
                        inputPlaceholder: 'أدخل كلمة المرور الجديدة',
                        showCancelButton: true,
                        confirmButtonText: 'حفظ',
                        cancelButtonText: 'إلغاء'
                    });

                    if (newPass) {
                        user.password = newPass.trim();
                        await this.saveUsersToDatabase();
                        Swal.fire('تم', 'تم تحديث كلمة المرور بنجاح', 'success');
                    }
                },

                async deleteUser(user) {
                    if (user.username === 'OMAR') {
                        Swal.fire('خطأ ممنوع', 'حساب OMAR محمي كلياً ولا يمكن حذفه نهائياً!', 'error');
                        return;
                    }

                    if (confirm(`هل أنت متأكد من حذف المستخدم ${user.username}؟`)) {
                        this.usersList = this.usersList.filter(u => u.username !== user.username);
                        await this.saveUsersToDatabase();
                        Swal.fire('تم', 'تم حذف المستخدم بنجاح', 'success');
                    }
                },

                async openChangePasswordModal() {
                    const { value: newPass } = await Swal.fire({
                        title: 'تغيير كلمة المرور الخاصة بك',
                        input: 'password',
                        inputPlaceholder: 'أدخل كلمة المرور الجديدة',
                        showCancelButton: true,
                        confirmButtonText: 'تغيير',
                        cancelButtonText: 'إلغاء'
                    });

                    if (newPass) {
                        this.currentUserObj.password = newPass.trim();
                        let found = this.usersList.find(u => u.username === this.currentUserObj.username);
                        if (found) found.password = newPass.trim();
                        await this.saveUsersToDatabase();
                        Swal.fire('تم بنجاح', 'تم تغيير كلمة المرور بنجاح', 'success');
                    }
                }
            }
        }
    </script>
</body>
</html>
