<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مخطط HR الذكي المتكامل</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800" x-data="hrApp()" x-init="init()">

    <!-- شاشة تسجيل الدخول -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-900 via-slate-800 to-emerald-900 p-4">
            <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 max-w-md w-full text-center border border-white/20">
                <div class="mb-6">
                    <div class="w-20 h-20 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner border border-emerald-100">
                        <i class="fas fa-users-cog"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800">مخطط HR الذكي</h1>
                    <p class="text-sm text-gray-500 mt-1">نظام إدارة الموارد البشرية والمهام المتكامل</p>
                </div>
                <div class="space-y-4 text-right">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">اسم المستخدم</label>
                        <input type="text" x-model="loginUser" class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition bg-gray-50" placeholder="أدخل اسم المستخدم">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                        <input type="password" x-model="loginPass" @keyup.enter="handleLogin()" class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition bg-gray-50" placeholder="أدخل كلمة المرور">
                    </div>
                    <button @click="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold transition shadow-lg shadow-emerald-600/25">دخول للنظام</button>
                    <p x-show="loginError" class="text-red-500 text-sm text-center font-medium mt-2">اسم المستخدم أو كلمة المرور غير صحيحة!</p>
                </div>
            </div>
        </div>
    </template>

    <!-- التطبيق الرئيسي -->
    <template x-if="isLoggedIn">
        <div class="min-h-screen flex flex-col">
            <!-- الهيدر -->
            <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center space-x-4 space-x-reverse">
                    <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-lg border border-emerald-100">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-gray-800">مخطط الـ HR الذكي</h1>
                        <span :class="isOnline ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'" class="text-xs px-2.5 py-0.5 rounded-full font-medium inline-block mt-0.5">
                            <span x-text="isOnline ? '🟢 متصل بقاعدة البيانات' : '🔴 غير متصل'"></span>
                        </span>
                    </div>
                </div>
                <div class="flex items-center space-x-3 space-x-reverse">
                    <button @click="syncData()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                        <i class="fas fa-sync-alt" :class="{'fa-spin': isSyncing}"></i> تحديث البيانات
                    </button>
                    <button @click="openChangePasswordModal()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                        <i class="fas fa-key"></i> كلمة المرور
                    </button>
                    <button @click="openAddUserModal()" class="bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                        <i class="fas fa-user-plus"></i> إضافة مستخدم
                    </button>
                    <div class="h-6 w-px bg-gray-200"></div>
                    <span class="text-sm font-bold text-gray-700" x-text="currentUser"></span>
                    <button @click="logout()" class="text-red-600 hover:text-red-800 text-sm font-medium flex items-center gap-1">
                        <i class="fas fa-sign-out-alt"></i> خروج
                    </button>
                </div>
            </header>

            <!-- المحتوى الرئيسي -->
            <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
                <!-- إحصائيات سريعة وتحليل البيانات -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">إجمالي المهام</p>
                            <h3 class="text-2xl font-bold text-gray-800 mt-1" x-text="tasks.length">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl"><i class="fas fa-tasks"></i></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">المهام المنجزة</p>
                            <h3 class="text-2xl font-bold text-emerald-600 mt-1" x-text="tasks.filter(t => t.status === 'completed').length">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl"><i class="fas fa-check-circle"></i></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">قيد التنفيذ</p>
                            <h3 class="text-2xl font-bold text-amber-600 mt-1" x-text="tasks.filter(t => t.status !== 'completed').length">0</h3>
                        </div>
                        <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl"><i class="fas fa-clock"></i></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                        <div>
                            <p class="text-sm text-gray-500 font-medium">نسبة الإنجاز العامة</p>
                            <h3 class="text-2xl font-bold text-indigo-600 mt-1" x-text="completionRate() + '%'">0%</h3>
                        </div>
                        <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl"><i class="fas fa-chart-pie"></i></div>
                    </div>
                </div>

                <!-- تحليل البيانات والرسوم البيانية المصغرة -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2"><i class="fas fa-chart-line text-indigo-600"></i> تحليل مؤشرات الأداء</h2>
                    <div class="w-full bg-gray-100 rounded-full h-4 overflow-hidden flex">
                        <div class="bg-emerald-500 h-full transition-all duration-500" :style="`width: ${completionRate()}%`" title="المنجزة"></div>
                        <div class="bg-amber-400 h-full transition-all duration-500" :style="`width: ${100 - completionRate()}%`" title="قيد التنفيذ"></div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-500 mt-2">
                        <span>🟢 المنجز: <strong x-text="tasks.filter(t => t.status === 'completed').length"></strong> مهام</span>
                        <span>🟡 قيد التنفيذ: <strong x-text="tasks.filter(t => t.status !== 'completed').length"></strong> مهام</span>
                        <span>👥 عدد المشرفين المسجلين: <strong x-text="usersList.length"></strong></span>
                    </div>
                </div>

                <!-- إضافة مهمة جديدة -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2"><i class="fas fa-plus-circle text-emerald-600"></i> إضافة مهمة جديدة</h2>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input type="text" x-model="newTask.title" placeholder="عنوان المهمة..." class="px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                        <input type="text" x-model="newTask.assignee" placeholder="المسؤول..." class="px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                        <input type="date" x-model="newTask.date" class="px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
                        <button @click="addTask()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl transition shadow-md shadow-emerald-600/25">حفظ المهمة</button>
                    </div>
                </div>

                <!-- جدول المهام -->
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-6 border-b flex justify-between items-center">
                        <h2 class="text-base font-bold text-gray-800">قائمة المهام</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                    <th class="p-4">المهمة</th>
                                    <th class="p-4">المسؤول</th>
                                    <th class="p-4">التاريخ</th>
                                    <th class="p-4">الحالة</th>
                                    <th class="p-4 text-center">الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                <template x-for="(task, index) in tasks" :key="index">
                                    <tr class="hover:bg-gray-50/50 transition">
                                        <td class="p-4 font-medium text-gray-800" x-text="task.title"></td>
                                        <td class="p-4 text-gray-600" x-text="task.assignee"></td>
                                        <td class="p-4 text-gray-600" x-text="task.date"></td>
                                        <td class="p-4">
                                            <span :class="task.status === 'completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'" class="text-xs px-2.5 py-1 rounded-full font-medium" x-text="task.status === 'completed' ? 'منجزة' : 'قيد التنفيذ'"></span>
                                        </td>
                                        <td class="p-4 text-center space-x-2 space-x-reverse">
                                            <button @click="toggleTaskStatus(index)" class="text-blue-600 hover:text-blue-800 text-sm font-medium"><i class="fas fa-check"></i> حالة</button>
                                            <button @click="deleteTask(index)" class="text-red-600 hover:text-red-800 text-sm font-medium"><i class="fas fa-trash"></i></button>
                                        </td>
                                    </tr>
                                </template>
                                <template x-if="tasks.length === 0">
                                    <tr>
                                        <td colspan="5" class="p-8 text-center text-gray-400">لا توجد مهام مضافة حالياً. ابدأ بإضافة مهمة جديدة!</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </template>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbAbb2oYBH1knwUL66cciMiaRu0tQa28WhG2Zo_vygVEcHcctWjpSBLsad_8Un6UjY/exec";

        function hrApp() {
            return {
                isLoggedIn: false,
                loginUser: '',
                loginPass: '',
                loginError: false,
                currentUser: '',
                currentUsernameKey: '',
                isOnline: false, // يبدأ كغير متصل إلى أن يتم التحقق بنجاح
                isSyncing: false,
                tasks: [],
                newTask: { title: '', assignee: '', date: '', status: 'pending' },
                usersList: ['OMAR', 'Mohamed.Desouky'],

                init() {
                    if (!localStorage.getItem('pass_OMAR')) {
                        localStorage.setItem('pass_OMAR', '8955');
                    }
                    if (!localStorage.getItem('pass_Mohamed.Desouky')) {
                        localStorage.setItem('pass_Mohamed.Desouky', '1980');
                    }
                    
                    if (localStorage.getItem('hr_users_list')) {
                        try {
                            this.usersList = JSON.parse(localStorage.getItem('hr_users_list'));
                        } catch(e) {}
                    }

                    this.loadDataFromSheet();
                },

                handleLogin() {
                    let user = this.loginUser.trim();
                    let storedPass = localStorage.getItem('pass_' + user);

                    if (storedPass && this.loginPass === storedPass) {
                        this.isLoggedIn = true;
                        this.currentUser = user + ' (أدمن)';
                        this.currentUsernameKey = user;
                        this.loginError = false;
                        this.syncData();
                    } else {
                        this.loginError = true;
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.loginUser = '';
                    this.loginPass = '';
                },

                completionRate() {
                    if (this.tasks.length === 0) return 0;
                    let completed = this.tasks.filter(t => t.status === 'completed').length;
                    return Math.round((completed / this.tasks.length) * 100);
                },

                async openChangePasswordModal() {
                    const { value: formValues } = await Swal.fire({
                        title: 'تغيير كلمة المرور',
                        html:
                            '<input id="swal-old-pass" type="password" class="swal2-input" placeholder="كلمة المرور الحالية">' +
                            '<input id="swal-new-pass" type="password" class="swal2-input" placeholder="كلمة المرور الجديدة">',
                        focusConfirm: false,
                        showCancelButton: true,
                        confirmButtonText: 'تغيير',
                        cancelButtonText: 'إلغاء',
                        preConfirm: () => {
                            return [
                                document.getElementById('swal-old-pass').value,
                                document.getElementById('swal-new-pass').value
                            ]
                        }
                    });

                    if (formValues) {
                        let [oldPass, newPass] = formValues;
                        let currentStoredPass = localStorage.getItem('pass_' + this.currentUsernameKey);

                        if (oldPass !== currentStoredPass) {
                            Swal.fire('خطأ', 'كلمة المرور الحالية غير صحيحة!', 'error');
                        } else if (!newPass || newPass.length < 4) {
                            Swal.fire('تنبيه', 'يجب ألا تقل كلمة المرور الجديدة عن 4 خانات', 'warning');
                        } else {
                            localStorage.setItem('pass_' + this.currentUsernameKey, newPass);
                            Swal.fire('تم بنجاح', 'تم تغيير كلمة المرور بنجاح', 'success');
                        }
                    }
                },

                async openAddUserModal() {
                    const { value: formValues } = await Swal.fire({
                        title: 'إضافة مستخدم / أدمن جديد',
                        html:
                            '<input id="swal-new-user" type="text" class="swal2-input" placeholder="اسم المستخدم الجديد">' +
                            '<input id="swal-new-user-pass" type="password" class="swal2-input" placeholder="كلمة المرور">',
                        focusConfirm: false,
                        showCancelButton: true,
                        confirmButtonText: 'إضافة المستخدم',
                        cancelButtonText: 'إلغاء',
                        preConfirm: () => {
                            return [
                                document.getElementById('swal-new-user').value.trim(),
                                document.getElementById('swal-new-user-pass').value
                            ]
                        }
                    });

                    if (formValues) {
                        let [newUsername, newUserPass] = formValues;
                        if (!newUsername || !newUserPass) {
                            Swal.fire('تنبيه', 'يرجى ملء جميع الحقول المطلوبة', 'warning');
                            return;
                        }
                        if (localStorage.getItem('pass_' + newUsername)) {
                            Swal.fire('خطأ', 'اسم المستخدم موجود مسبقاً!', 'error');
                            return;
                        }

                        localStorage.setItem('pass_' + newUsername, newUserPass);
                        if (!this.usersList.includes(newUsername)) {
                            this.usersList.push(newUsername);
                            localStorage.setItem('hr_users_list', JSON.stringify(this.usersList));
                        }

                        Swal.fire('تم بنجاح', `تم إضافة المستخدم (${newUsername}) بنجاح`, 'success');
                    }
                },

                async loadDataFromSheet() {
                    try {
                        // استخدام no-cors لضمان نجاح الاتصال بدون قيود المتصفح
                        const response = await fetch(SCRIPT_URL, { method: 'GET', mode: 'cors' });
                        const data = await response.json();
                        if (Array.isArray(data)) {
                            this.tasks = data;
                        }
                        this.isOnline = true;
                    } catch (e) {
                        // محاولة بديلة في حال قيود المتصفح
                        try {
                            const proxyResponse = await fetch(SCRIPT_URL);
                            const textData = await proxyResponse.text();
                            const data = JSON.parse(textData);
                            if (Array.isArray(data)) {
                                this.tasks = data;
                            }
                            this.isOnline = true;
                        } catch (err) {
                            this.isOnline = false;
                        }
                    }
                },

                async addTask() {
                    if (!this.newTask.title.trim()) {
                        Swal.fire('تنبيه', 'يرجى إدخال عنوان المهمة', 'warning');
                        return;
                    }
                    this.tasks.push({ ...this.newTask });
                    const taskToSave = { ...this.newTask };
                    this.newTask = { title: '', assignee: '', date: '', status: 'pending' };
                    
                    Swal.fire({ icon: 'success', title: 'تم الحفظ بنجاح', timer: 1500, showConfirmButton: false });
                    
                    try {
                        await fetch(SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(taskToSave)
                        });
                    } catch (e) {
                        console.error("Error saving to sheet", e);
                    }
                },

                toggleTaskStatus(index) {
                    this.tasks[index].status = this.tasks[index].status === 'completed' ? 'pending' : 'completed';
                },

                deleteTask(index) {
                    this.tasks.splice(index, 1);
                },

                async syncData() {
                    this.isSyncing = true;
                    await this.loadDataFromSheet();
                    this.isSyncing = false;
                    Swal.fire({ icon: 'success', title: 'تم تحديث البيانات بنجاح', timer: 1200, showConfirmButton: false });
                }
            }
        }
    </script>
</body>
</html>
